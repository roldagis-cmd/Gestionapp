<!doctype html>
<html lang="es">
<head>

<title>Gapp · GESTIONAPP</title>
<link rel="icon" href="/logo/favicon.ico" sizes="any">
<link rel="icon" href="/logo/gapp-icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo/gapp-icono-180.png">

<style>
/* Layout: libro de caja digital. Barra lateral fija en escritorio, barra inferior en el teléfono; contenido en una columna de tarjetas por rol. */
:root{
  --bg:#f5f3fa; --surface:#ffffff; --surface-2:#ece8f5; --line:#dcd5ea;
  --fg:#1d1630; --muted:#665d7a; --accent:#6c4cc4; --accent-fg:#ffffff; --accent-soft:#ebe4fa;
  --good:#1d7a45; --warn:#a86a00; --bad:#b3261e; --good-soft:#dcefe2; --warn-soft:#f6ead2; --bad-soft:#f6dcda;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151020; --surface:#1d1729; --surface-2:#271f36; --line:#362c49;
  --fg:#efeafc; --muted:#a99fc0; --accent:#b9a6ee; --accent-fg:#1b1230; --accent-soft:#2f2547;
  --good:#5fd08e; --warn:#e7b04f; --bad:#f08077; --good-soft:#173525; --warn-soft:#3a2d12; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151020; --surface:#1d1729; --surface-2:#271f36; --line:#362c49;
  --fg:#efeafc; --muted:#a99fc0; --accent:#b9a6ee; --accent-fg:#1b1230; --accent-soft:#2f2547;
  --good:#5fd08e; --warn:#e7b04f; --bad:#f08077; --good-soft:#173525; --warn-soft:#3a2d12; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand{gap:10px}
.brand img{display:block;height:auto;max-width:150px}
.logo-oscuro{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-claro{display:none!important}:root:not([data-theme="light"]) .logo-oscuro{display:block!important}}
:root[data-theme="dark"] .logo-claro{display:none!important} :root[data-theme="dark"] .logo-oscuro{display:block!important}
.emp-sel{display:flex;flex-direction:column;gap:3px}
.emp-sel .lab{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.emp-sel select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;width:100%}
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.auth .modal{animation:none;max-height:none}
.auth .logo-claro,.auth .logo-oscuro{max-width:200px;margin:0 auto 6px}
.side .salir{margin-top:auto}
.mob-emp{display:none;flex-direction:column;gap:3px}
.mob-emp .lab{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mob-emp select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-weight:500}
nav.menu a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
nav.menu a:hover{background:var(--surface-2)}
nav.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
main{padding-block:24px 96px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));min-width:0}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.head p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sale{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.exp{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.btn.danger{color:var(--bad);border-color:var(--bad)}

.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h2{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--font-display);font-size:1.55rem;font-weight:700}
.kpi .sub{font-size:.82rem;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.good > i{background:var(--good)} .meter.warn > i{background:var(--warn)} .meter.bad > i{background:var(--bad)}
.light{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:99px}
.light::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.light.good{color:var(--good);background:var(--good-soft)} .light.warn{color:var(--warn);background:var(--warn-soft)} .light.bad{color:var(--bad);background:var(--bad-soft)}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.92rem}
.alerts li .light{flex:none}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t-venta{background:var(--good-soft);color:var(--good)} .t-cobro{background:var(--accent-soft);color:var(--accent)}
.t-gasto{background:var(--bad-soft);color:var(--bad)} .t-pago{background:var(--warn-soft);color:var(--warn)}
.ex{font-size:.7rem;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--bad);border-radius:99px}
.bar.in .track i{background:var(--good)}

.overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--fg) 40%, transparent);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
form.f{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.field input.big{font-size:1.4rem;font-family:var(--font-display);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:.85rem;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;font-size:.9rem}
.fab{display:none}
.doc{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg);font-size:.9rem}
.doc .letter{font-family:var(--font-display);font-size:2rem;font-weight:700;border:2px solid var(--fg);width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:6px;flex:none}
.doc .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.doc dt{color:var(--muted)} .doc dd{margin:0}
.items td input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;width:100%}
.items td{padding:4px 4px;border:none}
.cat-table td,.cat-table th{padding:6px 8px}
.cat-table tr.cur td{background:var(--accent-soft);font-weight:700}
.cat-table tr.need td{background:var(--warn-soft)}
.mbars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.mbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.mbars .c i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.mbars .c span{font-size:.68rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:140px;min-width:0}
.dia.hoy{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dia-h{display:flex;justify-content:space-between;align-items:center}
.dia .vacio{color:var(--muted);font-size:.8rem}
.turno{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.turno:hover{border-color:var(--accent)}
.turno.tachado{opacity:.55;text-decoration:line-through}
.turnos-hoy{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
details summary{cursor:pointer;font-weight:600}
@media (max-width:900px){.semana{grid-template-columns:1fr}.dia{min-height:0}}

@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:1fr}}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));border-right:0;border-top:1px solid var(--line);z-index:40}
  .brand{display:none}
  .mob-emp{display:flex!important}
  nav.menu{flex-direction:row;justify-content:space-between;width:100%;overflow-x:auto;scrollbar-width:none}
  nav.menu a{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 4px;flex:1 0 64px;text-align:center}
  .g2{grid-template-columns:1fr}
  .bar{grid-template-columns:90px 1fr auto}
  .hide-sm{display:none}
  h1{font-size:1.35rem}
}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr} .kpi .val{font-size:1.25rem} .two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
</style>

<body>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img class="logo-claro" src="/logo/gapp-logo.svg" alt="Gapp, Gestión App" width="150" height="56"><img class="logo-oscuro" src="/logo/gapp-logo-oscuro.svg" alt="Gapp, Gestión App" width="150" height="56">
      <label class="emp-sel" for="empSel"><span class="lab">Empresa</span><select id="empSel"></select></label></div>
    <nav class="menu" id="menu"></nav>
    <button class="btn ghost salir hide-sm" type="button" id="btnSalir">Salir</button>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="auth" class="auth" hidden></div>
<div id="modalRoot"></div>

<script>
(() => {
"use strict";
// ---------- utilidades ----------
const $ = (s, el=document) => el.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="class") el.className=v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="html") el.innerHTML=v; // solo para íconos propios
    else el.setAttribute(k, v===true?"":v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
const fmt = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const money = n => fmt.format(Math.round(n||0));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => iso(new Date());
const parseD = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const monthKey = s => s.slice(0,7);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const monthLabel = k => { const [y,m]=k.split("-").map(Number); return MESES[m-1]+" "+y; };
const fDate = s => { const [y,m,d]=s.split("-"); return d+"/"+m+"/"+y.slice(2); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const CATS = ["Mercadería","Alquiler","Servicios","Sueldos","Impuestos","Otros"];
const MEDIOS = {efectivo:"Efectivo", transferencia:"Transferencia", cuenta:"A cuenta"};
const TIPOS = {venta:"Venta", gasto:"Gasto/compra", cobro:"Cobro", pago:"Pago"};
// Escalas de monotributo vigentes desde agosto de 2026 hasta la actualización de enero de 2027.
// Fuente: tabla publicada por ARCA (reproducida por iProfesional, 02/08/2026). Verificar en arca.gob.ar al actualizar.
const ESCALA_VIGENCIA = "agosto 2026 a enero 2027";
const CATEGORIAS = [
  ["A",12009410,49527.18,49527.18],["B",17595182,56379,56379],["C",24670494,64539,66020],["D",30628651,82564,84614],
  ["E",36028231,108267,119811],["F",45151659,129930,150784],["G",53995798,158815,230612],["H",81924660,317895,522706],
  ["I",91699761,474994,963747],["J",105012519,580793,1167299],["K",126610830,702103,1614446.02]
].map(([cat,tope,bienes,servicios])=>({cat,tope,bienes,servicios}));
// Códigos de comprobante de ARCA
const CBTE = {1:"Factura A",2:"Nota de débito A",3:"Nota de crédito A",6:"Factura B",7:"Nota de débito B",8:"Nota de crédito B",11:"Factura C",12:"Nota de débito C",13:"Nota de crédito C",51:"Factura M",53:"Nota de crédito M",201:"Factura de crédito electrónica A",206:"Factura de crédito electrónica B",211:"Factura de crédito electrónica C",203:"Nota de crédito electrónica A",208:"Nota de crédito electrónica B",213:"Nota de crédito electrónica C"};
const esNC = cod => [3,8,13,53,203,208,213].includes(+cod);
const cbteName = cod => CBTE[cod] || ("Comprobante "+cod);
const cbteLetter = cod => (cbteName(cod).match(/ ([ABCM])$/)||[,"C"])[1];
const nro = f => String(f.puntoVenta||0).padStart(5,"0")+"-"+String(f.numero||0).padStart(8,"0");

// ---------- estado ----------
const EMPTY_CONFIG = {nombre:"Tu negocio", costosFijos:0, margen:35, topeMonotributo:0, categoria:"", actividad:"bienes", cuit:"", razonSocial:"", domicilio:"", inicioAct:"", puntoVenta:1};
const S = { clientes:[], proveedores:[], movs:[], facturas:[], productos:[], turnos:[], config:{...EMPTY_CONFIG}, mode:"loading" };

function demoData(){
  const t = today(), d = n => addDays(t,-n);
  const cl = [["c1","Almacén Don Pedro","1123456789"],["c2","Lucía Fernández","1198765432"],["c3","Kiosco El Sol","1155512345"]]
    .map(([id,nombre,telefono])=>({id,nombre,telefono,cuit:"",ejemplo:true}));
  const pr = [["p1","Distribuidora Norte","Mercadería"],["p2","Inmobiliaria Centro","Alquiler"]]
    .map(([id,nombre,rubro])=>({id,nombre,rubro,telefono:"",cuit:"",ejemplo:true}));
  const m = [];
  const add = (dd,tipo,monto,medio,extra={}) => m.push({id:uid(),fecha:d(dd),tipo,monto,medio,detalle:"",categoria:"",clienteId:"",proveedorId:"",ts:Date.now()-dd*864e5,ejemplo:true,...extra});
  for (let i=0;i<60;i++){ add(i,"venta",18000+((i*7919)%9)*4200,"efectivo"); if(i%3===0) add(i,"venta",25000+((i*31)%5)*6000,"transferencia"); }
  add(42,"venta",86000,"cuenta",{clienteId:"c1",detalle:"Pedido mensual"});
  add(20,"venta",54000,"cuenta",{clienteId:"c1"});
  add(9,"venta",32000,"cuenta",{clienteId:"c2"});
  add(15,"cobro",40000,"transferencia",{clienteId:"c1"});
  add(3,"venta",21000,"cuenta",{clienteId:"c3"});
  for (const k of [0,30,60]){ add(k+2,"gasto",420000,"transferencia",{categoria:"Mercadería",proveedorId:"p1"}); add(k+5,"gasto",380000,"transferencia",{categoria:"Alquiler",proveedorId:"p2"}); add(k+8,"gasto",65000,"efectivo",{categoria:"Servicios",detalle:"Luz y gas"}); }
  add(1,"gasto",310000,"cuenta",{categoria:"Mercadería",proveedorId:"p1",detalle:"Reposición"});
  add(4,"gasto",190000,"efectivo",{categoria:"Servicios",detalle:"Arreglo heladera"});
  const fs=[]; let n=1180;

// ---------- cálculos ----------
const isCaja = m => m.medio!=="cuenta";
function cajaDelta(m){ if(!isCaja(m)) return 0; return (m.tipo==="venta"||m.tipo==="cobro") ? m.monto : -m.monto; }
function deuda(kind, id){
  // FIFO: compras/ventas a cuenta menos pagos/cobros. Devuelve saldo y fecha de la deuda impaga más vieja.
  const [cargo, abono, key] = kind==="cliente" ? ["venta","cobro","clienteId"] : ["gasto","pago","proveedorId"];
  const ms = S.movs.filter(m=>m[key]===id);
  const cargos = ms.filter(m=>m.tipo===cargo && m.medio==="cuenta").sort((a,b)=>a.fecha<b.fecha?-1:1);
  let abonado = ms.filter(m=>m.tipo===abono).reduce((s,m)=>s+m.monto,0);
  const total = cargos.reduce((s,m)=>s+m.monto,0);
  let desde = null;
  for (const c of cargos){ if (abonado>=c.monto){ abonado-=c.monto; continue; } desde=c.fecha; break; }
  const saldo = total - ms.filter(m=>m.tipo===abono).reduce((s,m)=>s+m.monto,0);
  return {saldo, desde: saldo>0?desde:null, dias: saldo>0&&desde?daysBetween(desde,today()):0};
}
function sum(arr, f=()=>true){ return arr.filter(f).reduce((s,m)=>s+m.monto,0); }
function stats(){
  const t=today(), mk=monthKey(t);
  const hoyV = sum(S.movs,m=>m.fecha===t&&m.tipo==="venta"), hoyG = sum(S.movs,m=>m.fecha===t&&m.tipo==="gasto");
  const mesV = sum(S.movs,m=>monthKey(m.fecha)===mk&&m.tipo==="venta"), mesG = sum(S.movs,m=>monthKey(m.fecha)===mk&&m.tipo==="gasto");
  const caja = S.movs.reduce((s,m)=>s+cajaDelta(m),0);
  const cajaHoy = S.movs.filter(m=>m.fecha===t).reduce((s,m)=>s+cajaDelta(m),0);
  const desde12 = addDays(t,-365);
  const v12 = sum(S.movs,m=>m.tipo==="venta"&&m.fecha>desde12);
  const meCobran = S.clientes.reduce((s,c)=>s+Math.max(0,deuda("cliente",c.id).saldo),0);
  const debo = S.proveedores.reduce((s,p)=>s+Math.max(0,deuda("proveedor",p.id).saldo),0);
  const c = S.config, pe = c.margen>0 ? c.costosFijos/(c.margen/100) : 0;
  return {hoyV,hoyG,mesV,mesG,caja,cajaHoy,v12,meCobran,debo,pe};
}
// Facturación y monotributo
const signo = f => esNC(f.cbte) ? -1 : 1;
function facturado(desde, hasta){ return S.facturas.filter(f=>f.fecha>desde && f.fecha<=hasta).reduce((s,f)=>s+signo(f)*(+f.total||0),0); }
function mono(){
  const t=today(), c=S.config;
  const desde=addDays(t,-365);
  const base = S.facturas.length ? "facturas" : "ventas";
  const total12 = base==="facturas" ? facturado(desde,t) : sum(S.movs,m=>m.tipo==="venta"&&m.fecha>desde);
  const cur = CATEGORIAS.find(x=>x.cat===c.categoria) || null;
  const tope = cur ? cur.tope : (+c.topeMonotributo||0);
  const corresponde = CATEGORIAS.find(x=>total12<=x.tope) || null; // null = excede K
  // meses: últimos 12 meses calendario
  const meses=[]; const d0=parseD(t); d0.setDate(1);
  for (let i=11;i>=0;i--){ const d=new Date(d0); d.setMonth(d.getMonth()-i); const k=iso(d).slice(0,7);
    const v = base==="facturas" ? S.facturas.filter(f=>monthKey(f.fecha)===k).reduce((s,f)=>s+signo(f)*(+f.total||0),0) : sum(S.movs,m=>m.tipo==="venta"&&monthKey(m.fecha)===k);
    meses.push([k,v]); }
  const ritmo = meses.slice(-4,-1).reduce((s,x)=>s+x[1],0)/3; // promedio de los 3 meses cerrados
  const margen = tope - total12;
  const mesesHastaTope = ritmo>0 && margen>0 ? margen/ritmo : null;
  const pend = S.facturas.filter(f=>f.estado==="pendiente").length;
  return {base,total12,cur,tope,corresponde,meses,ritmo,margen,mesesHastaTope,pend,pct: tope>0?total12/tope:0};
}
function proxRecat(){ const d=parseD(today()), y=d.getFullYear(), m=d.getMonth();
  // ARCA recategoriza en enero (ingresos ene-dic) y julio (jul-jun), con plazo hasta el día 5 del mes siguiente al semestre.
  return m<6 ? {mes:"julio "+y, periodo:"julio "+(y-1)+" a junio "+y} : {mes:"enero "+(y+1), periodo:"enero a diciembre "+y}; }
function level(p){ return p>=.9?"bad":p>=.7?"warn":"good"; }
function alertas(st){
  const out=[];
  for (const c of S.clientes){ const d=deuda("cliente",c.id); if (d.saldo>0 && d.dias>30) out.push(["bad", c.nombre+" debe "+money(d.saldo)+" hace "+d.dias+" días."]); else if (d.saldo>0 && d.dias>15) out.push(["warn", c.nombre+" debe "+money(d.saldo)+" hace "+d.dias+" días."]); }
  { const mo=mono();
    if (mo.tope>0 && mo.pct>1) out.push(["bad","Lo facturado en 12 meses ("+money(mo.total12)+") supera el tope de la categoría "+(S.config.categoria||"actual")+". "+(mo.corresponde?"Corresponde la categoría "+mo.corresponde.cat+".":"Supera la categoría K: revisá la exclusión del régimen.")]);
    else if (mo.tope>0 && mo.pct>=.8) out.push([level(mo.pct),"Facturaste el "+Math.round(mo.pct*100)+"% del tope de tu categoría de monotributo en los últimos 12 meses."]);
    if (mo.pend) out.push(["warn", mo.pend+(mo.pend===1?" factura espera":" facturas esperan")+" el CAE de ARCA."]); }
  // gasto inusual: categoría del mes mayor a 1,5 veces el promedio de los 3 meses anteriores
  const mk=monthKey(today()), prev=[1,2,3].map(n=>{const d=parseD(today()); d.setDate(1); d.setMonth(d.getMonth()-n); return iso(d).slice(0,7);});
  for (const cat of CATS){
    const act=sum(S.movs,m=>m.tipo==="gasto"&&m.categoria===cat&&monthKey(m.fecha)===mk);
    const prom=prev.reduce((s,k)=>s+sum(S.movs,m=>m.tipo==="gasto"&&m.categoria===cat&&monthKey(m.fecha)===k),0)/3;
    if (prom>0 && act>prom*1.5) out.push(["warn","Este mes gastaste "+money(act)+" en "+cat+", más de lo habitual (promedio "+money(prom)+")."]);
  }
  if (st.caja<0) out.push(["bad","La caja da negativa: revisá si falta cargar algún ingreso."]);
  const bajos=S.productos.filter(p=>p.minimo!=null&&p.minimo!==""&&stockDe(p)<=+p.minimo);
  if (bajos.length) out.push([bajos.some(p=>stockDe(p)<=0)?"bad":"warn", bajos.length===1?"Stock bajo: "+bajos[0].nombre+" (quedan "+stockDe(bajos[0])+")." : bajos.length+" productos con stock bajo el mínimo: "+bajos.slice(0,4).map(p=>p.nombre).join(", ")+(bajos.length>4?"…":"")+"."]);
  return out;
}

async function api(method, url, body, form){
  const opts={method, credentials:"same-origin", headers:{"x-gestionapp":"1"}};
  if (body!=null){ if(form) opts.body=body; else { opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); } }
  let r; try { r=await fetch(url,opts); } catch(_){ const e=new Error("No hay conexión con el servidor."); e.status=0; throw e; }
  let j=null; try { j=await r.json(); } catch(_){}
  if (!r.ok){ const e=new Error((j&&j.error)||("Error "+r.status)); e.status=r.status; throw e; }
  return j;
}

// Importación del CSV de "Mis Comprobantes" emitidos (ARCA). Tolera separador ; o , y fechas dd/mm/aaaa o aaaa-mm-dd.
function parseCSV(txt){
  txt=txt.replace(/^﻿/,"");
  const first=txt.split(/\r?\n/)[0]||""; const sep=(first.split(";").length>=first.split(",").length)?";":",";
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<txt.length;i++){ const ch=txt[i];
    if (q){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if (ch==='"') q=true; else if (ch===sep){ row.push(cur); cur=""; } else if (ch==="\n"){ row.push(cur.replace(/\r$/,"")); rows.push(row); row=[]; cur=""; } else cur+=ch; }
  if (cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}

    const st=h("p",{style:"margin:0;color:var(--muted)",role:"status"}, API.ocr ? "Subí una foto o un PDF de una factura, ticket o nota de crédito. La IA lee los datos y vos los revisás antes de guardar. Nada se guarda sin tu confirmación." : "La lectura con IA no está activada en este servidor. Pedile a quien administra GESTIONAPP que configure la clave de la API de Claude.");

    const go=h("button",{class:"btn primary",type:"button",disabled:!API.ocr,onclick:async()=>{

function field(label, input){ const id=input.id||("f-"+uid()); input.id=id; return h("div",{class:"field"}, h("label",{for:id},label), input); }

// ---------- formularios ----------
function modal(title, body){
  const root=$("#modalRoot");
  const close=()=>{ root.replaceChildren(); document.removeEventListener("keydown",esc); };
  const esc=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",esc);
  const ov=h("div",{class:"overlay",onclick:e=>{ if(e.target===ov) close(); }}, h("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":title}, h("div",{class:"row"}, h("h2",{},title), h("button",{class:"btn small ghost",onclick:close,"aria-label":"Cerrar"},"Cerrar")), body(close)));
  root.replaceChildren(ov);
  setTimeout(()=>{ const i=ov.querySelector("input.big, input, select"); if(i) i.focus(); },30);
}
function movForm(m0){
  const editing = !!m0.id;
  const st = {tipo:m0.tipo||"venta", medio:m0.medio||(m0.tipo==="cobro"||m0.tipo==="pago"?"transferencia":"efectivo")};
  const lineas=(m0.items||[]).map(i=>({...i}));
  modal(editing?"Editar movimiento":"Nuevo movimiento", close=>{
    const err=h("p",{class:"err",role:"alert"});
    const body=h("div",{style:"display:flex;flex-direction:column;gap:12px"});
    const draw=()=>{
      const isV=st.tipo==="venta"||st.tipo==="cobro";
      const medios = (st.tipo==="venta"||st.tipo==="gasto") ? MEDIOS : {efectivo:"Efectivo",transferencia:"Transferencia"};
      if (!medios[st.medio]) st.medio="efectivo";
      const keep = id => { const el=$("#"+id, body); return el?el.value:null; };
      const vals = {monto:keep("mv-monto")??(m0.monto||""), fecha:keep("mv-fecha")??(m0.fecha||today()), det:keep("mv-det")??(m0.detalle||""), cli:keep("mv-cli")??(m0.clienteId||""), prov:keep("mv-prov")??(m0.proveedorId||""), cat:keep("mv-cat")??(m0.categoria||"Mercadería")};
      const needsPerson = st.medio==="cuenta" || st.tipo==="cobro" || st.tipo==="pago";
      body.replaceChildren(
        h("div",{class:"seg",role:"group","aria-label":"Tipo"}, Object.entries(TIPOS).map(([k,l])=>h("button",{type:"button","aria-pressed":st.tipo===k?"true":"false",onclick:()=>{st.tipo=k;draw();}},l))),
        field("Monto ($)", h("input",{id:"mv-monto",class:"big num",type:"number",inputmode:"decimal",min:"0",step:"0.01",value:vals.monto,required:true})),
        h("div",{class:"seg",role:"group","aria-label":"Medio"}, Object.entries(medios).map(([k,l])=>h("button",{type:"button","aria-pressed":st.medio===k?"true":"false",onclick:()=>{st.medio=k;draw();}},l))),
        st.medio==="cuenta" ? h("p",{style:"margin:-6px 0 0;color:var(--muted);font-size:.85rem"}, isV?"Queda en la cuenta del cliente hasta que te pague.":"Queda como deuda con el proveedor hasta que le pagues.") : null,
        h("div",{class:"two"},
          field("Fecha", h("input",{id:"mv-fecha",type:"date",value:vals.fecha,required:true})),
          isV ? field("Cliente"+(needsPerson?"":" (opcional)"), h("select",{id:"mv-cli"}, h("option",{value:""},"—"), S.clientes.map(c=>h("option",{value:c.id,selected:c.id===vals.cli},c.nombre))))
              : field("Proveedor"+(needsPerson?"":" (opcional)"), h("select",{id:"mv-prov"}, h("option",{value:""},"—"), S.proveedores.map(p=>h("option",{value:p.id,selected:p.id===vals.prov},p.nombre))))),
        st.tipo==="gasto" ? field("Categoría", h("select",{id:"mv-cat"}, CATS.map(c=>h("option",{selected:c===vals.cat},c)))) : null,
        (st.tipo==="venta"||st.tipo==="gasto") && S.productos.length ? lineasProductos() : null,
        field("Detalle (opcional)", h("input",{id:"mv-det",value:vals.det,placeholder:st.tipo==="venta"?"Ej.: 3 cajas de galletitas":"Ej.: Factura de luz"})),
        err);
    };
    function lineasProductos(){
      const autoMonto=()=>{ const t=lineas.reduce((s,l)=>{ const p=S.productos.find(x=>x.id===l.productoId); return s+(+l.cant||0)*(p?(st.tipo==="venta"?+p.precio||0:+p.costo||0):0); },0); if(t>0){ const m=$("#mv-monto",body); if(m) m.value=String(Math.round(t*100)/100); } };
      const wrap=h("div",{class:"stack"}, h("label",{style:"font-size:.82rem;font-weight:600;color:var(--muted)"}, st.tipo==="venta"?"Productos vendidos (descuenta stock)":"Productos comprados (suma stock)"),
        ...lineas.map((l,i)=>h("div",{style:"display:grid;grid-template-columns:1fr 90px auto;gap:6px"},
          h("select",{"aria-label":"Producto",onchange:e=>{l.productoId=e.target.value;autoMonto();}}, h("option",{value:""},"Elegí"), S.productos.map(p=>h("option",{value:p.id,selected:p.id===l.productoId},p.nombre+" ("+stockDe(p)+")"))),
          h("input",{"aria-label":"Cantidad",type:"number",min:"0",step:"any",value:l.cant,oninput:e=>{l.cant=e.target.value;autoMonto();}}),
          h("button",{type:"button",class:"btn small ghost","aria-label":"Quitar",onclick:()=>{lineas.splice(i,1);draw();}},"×"))),
        h("div",{}, h("button",{type:"button",class:"btn small",onclick:()=>{lineas.push({productoId:"",cant:1});draw();}},"+ Producto")));
      return wrap;
    }
    draw();
    const f=h("form",{class:"f",onsubmit:async e=>{
      e.preventDefault();
      const monto=parseFloat($("#mv-monto",f).value); const fecha=$("#mv-fecha",f).value;
      const isV=st.tipo==="venta"||st.tipo==="cobro";
      const cli=isV?($("#mv-cli",f)||{}).value||"":""; const prov=!isV?($("#mv-prov",f)||{}).value||"":"";
      if (!(monto>0)) { err.textContent="Ingresá un monto mayor a cero."; return; }
      if (!fecha) { err.textContent="Elegí una fecha."; return; }
      if ((st.medio==="cuenta"||st.tipo==="cobro") && isV && !cli) { err.textContent= S.clientes.length?"Elegí el cliente.":"Primero cargá el cliente en la sección Clientes."; return; }
      if ((st.medio==="cuenta"||st.tipo==="pago") && !isV && !prov) { err.textContent= S.proveedores.length?"Elegí el proveedor.":"Primero cargá el proveedor en la sección Proveedores."; return; }
      const obj={id:m0.id||uid(), tipo:st.tipo, monto:Math.round(monto*100)/100, medio:st.medio, fecha, clienteId:cli, proveedorId:prov, categoria:st.tipo==="gasto"?$("#mv-cat",f).value:"", detalle:$("#mv-det",f).value.trim(), items:(st.tipo==="venta"||st.tipo==="gasto")?lineas.filter(l=>l.productoId&&+l.cant>0).map(l=>({productoId:l.productoId,cant:+l.cant})):[], facturaId:m0.facturaId||"", ts:m0.ts||Date.now(), ejemplo:false};
      const b=f.querySelector("button[type=submit]"); b.disabled=true;
      try{ await save("movs",obj); close(); toast(TIPOS[obj.tipo]+" de "+money(obj.monto)+" guardado."); }catch(_){ b.disabled=false; }
    }}, body, h("div",{class:"actions"}, h("button",{class:"btn primary",type:"submit"},editing?"Guardar cambios":"Guardar"), h("button",{class:"btn",type:"button",onclick:close},"Cancelar")));
    return f;
  });
}

    const err=h("p",{class:"err",role:"alert"});

      e.preventDefault(); const fd=new FormData(f); const nombre=fd.get("nombre").trim();

      if(!isC) obj.rubro=fd.get("rubro").trim();
      try{ await save(col,obj); close(); toast((isC?"Cliente":"Proveedor")+" guardado."); }catch(_){}
    }},
      field("Nombre o razón social", h("input",{id:"p-nombre",name:"nombre",value:x.nombre||"",required:true})),
      h("div",{class:"two"},
        field("Teléfono / WhatsApp", h("input",{id:"p-tel",name:"telefono",type:"tel",value:x.telefono||"",placeholder:"11 2345 6789"})),
        field("CUIT (opcional)", h("input",{id:"p-cuit",name:"cuit",value:x.cuit||"",placeholder:"20-12345678-9"}))),
      isC?null:field("Rubro", h("input",{id:"p-rubro",name:"rubro",value:x.rubro||"",placeholder:"Ej.: Mercadería"})),
      err,
      h("div",{class:"actions"}, h("button",{class:"btn primary",type:"submit"},"Guardar"), h("button",{class:"btn",type:"button",onclick:close},"Cancelar")));
    return f;
  });
}
let toastT;
function toast(msg){ let t=$("#toast"); if(!t){ t=h("div",{id:"toast",class:"toast",role:"status"}); document.body.append(t); } t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

function render(){
  renderMenu();

  const v = r==="inicio"?vInicio() : r==="movimientos"?vMovimientos() : r==="clientes"?vPersonas("cliente") : r==="proveedores"?vPersonas("proveedor") : r==="reportes"?vReportes() : r==="facturas"?vFacturas() : r==="stock"?vStock() : r==="turnos"?vTurnos() : r==="monotributo"?vMonotributo() : vAjustes();
